name: Android release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the Android debug package without signing or store upload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deepbubble-android-${{ github.ref }}
  cancel-in-progress: false

env:
  COCOS_VERSION: 3.8.6
  COCOS_ZIP: CocosCreator-v3.8.6-mac-032501.zip
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_COMPILE_SDK_VERSION: 36
  ANDROID_TARGET_SDK_VERSION: 36

jobs:
  android:
    name: Build AAB and upload Play draft
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK_VERSION}" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Restore Cocos Creator
        id: cocos-cache
        uses: actions/cache@v4
        with:
          path: ~/cocos-creator
          key: cocos-creator-${{ env.COCOS_VERSION }}-mac

      - name: Download Cocos Creator
        if: steps.cocos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/cocos-creator"
          URL="https://download.cocos.com/CocosCreator/v${COCOS_VERSION}/${COCOS_ZIP}"
          for attempt in 1 2 3 4 5; do
            curl -L --fail -C - -o /tmp/cocos.zip "$URL" || true
            if unzip -tq /tmp/cocos.zip >/dev/null 2>&1; then
              echo "Cocos Creator archive verified"
              break
            fi
            echo "::warning::Cocos Creator download attempt $attempt was incomplete"
            sleep 15
          done
          unzip -tq /tmp/cocos.zip
          unzip -q /tmp/cocos.zip -d "$HOME/cocos-creator"

      - name: Register Cocos Creator
        run: |
          set -euo pipefail
          COCOS="$HOME/cocos-creator/CocosCreator.app/Contents/MacOS/CocosCreator"
          test -x "$COCOS"
          echo "COCOS=$COCOS" >> "$GITHUB_ENV"

      - name: Set up Android signing
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::ANDROID_KEYSTORE_* secrets are not configured"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/deepbubble-release.keystore"
          {
            echo "KEYSTORE=$RUNNER_TEMP/deepbubble-release.keystore"
            echo "KEYSTORE_PASS=$KEYSTORE_PASSWORD"
            echo "KEYSTORE_USER=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Set release version
        if: ${{ !inputs.dry_run }}
        run: eval "$(python3 tools/set_versions.py get)" && echo "VERSION=$version" >> "$GITHUB_ENV" && echo "BUILD=$build" >> "$GITHUB_ENV"

      - name: Build Android package
        env:
          STAGE: ${{ inputs.dry_run && 'debug' || 'release' }}
          TARGET_SDK: ${{ env.ANDROID_TARGET_SDK_VERSION }}
          COMPILE_SDK: ${{ env.ANDROID_COMPILE_SDK_VERSION }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: ./tools/build_android.sh

      - name: Stage signed AAB
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp export/android/deepbubble1024-release.aab "dist/deepbubble1024-$VERSION+$BUILD.aab"
          (cd dist && shasum -a 256 "deepbubble1024-$VERSION+$BUILD.aab" > "deepbubble1024-$VERSION+$BUILD.aab.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.dry_run && 'android-debug' || 'deepbubble-aab' }}
          path: ${{ inputs.dry_run && 'export/android/*.apk' || 'dist/*' }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play (internal + production draft)
        if: ${{ !inputs.dry_run }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured"
            exit 1
          fi
          python3 -m pip install --quiet --break-system-packages 'PyJWT[crypto]' \
            || python3 -m pip install --quiet 'PyJWT[crypto]'
          python3 tools/play_upload_release.py \
            --package tech.zhongbei.deepbubble1024 \
            --aab "dist/deepbubble1024-$VERSION+$BUILD.aab" \
            --version "$VERSION"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/deepbubble-release.keystore"
